[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-dashboard-api"
version = "0.1.0"
description = "FastAPI service for ontology-aware dashboards, governed actions, and domain packs"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.28",
  "google-genai>=1.0",
  "jsonschema>=4.23",
  "openpyxl>=3.1",
  "joblib>=1.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
  "PyYAML>=6.0",
  "reportlab>=4.2",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
postgres = ["psycopg[binary]>=3.2", "psycopg_pool>=3.2"]
model-runtimes = ["lightgbm>=4.0,<5.0", "xgboost>=2.0,<3.0"]
macmini = [
  "psycopg[binary]>=3.2",
  "psycopg_pool>=3.2",
  "redis>=5.0",
  "lightgbm>=4.0,<5.0",
  "xgboost>=2.0,<3.0"
]
polyglot = [
  "psycopg[binary]>=3.2",
  "psycopg_pool>=3.2",
  "neo4j>=5",
  "redis>=5.0",
  "pyarrow>=17",
  "lightgbm>=4.0,<5.0",
  "xgboost>=2.0,<3.0"
]
production = [
  "psycopg[binary]>=3.2",
  "psycopg_pool>=3.2",
  "neo4j>=5",
  "redis>=5.0",
  "pyarrow>=17",
  "lightgbm>=4.0,<5.0",
  "xgboost>=2.0,<3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ontology_dashboard*", "app*"]

[tool.setuptools.package-data]
"app.diagnosis" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["../../tests", "tests"]
