name: predictive-maintenance-mvp

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ontology_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-ontology}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ontology-local-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ontology_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    profiles: ["rate-limit"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-ontology-local-only}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ontology_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD:-ontology-local-only}' ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
      args:
        API_EXTRAS: production
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-1}
      ONTOLOGY_DASHBOARD_DATABASE_URL: ${ONTOLOGY_DASHBOARD_DATABASE_URL:-postgresql://ontology:ontology-local-only@postgres:5432/ontology_dashboard}
      ONTOLOGY_DASHBOARD_ALLOWED_ORIGINS: ${ONTOLOGY_DASHBOARD_ALLOWED_ORIGINS:-http://127.0.0.1:3100}
      ONTOLOGY_DASHBOARD_REDIS_URL: ${ONTOLOGY_DASHBOARD_REDIS_URL:-}
      ONTOLOGY_DASHBOARD_RUN_STARTUP_MIGRATIONS: "1"
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8100}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3100}:8080"

volumes:
  ontology_postgres_data:
  ontology_redis_data:
