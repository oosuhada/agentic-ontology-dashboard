services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-1}
      ONTOLOGY_DASHBOARD_ALLOWED_ORIGINS: ${ONTOLOGY_DASHBOARD_ALLOWED_ORIGINS:-}
      ONTOLOGY_DASHBOARD_DB: /app/data/local/ontology_dashboard.db
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      # The host path below is mounted at this fixed in-container path.
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/google/credentials.json
      PROJECT3_API_URL: ${PROJECT3_API_URL:-}
    ports:
      - "8100:8000"
    volumes:
      - factory_signal_data:/app/data/local
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:/var/run/secrets/google/credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8100
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3100:3100"

volumes:
  factory_signal_data:
