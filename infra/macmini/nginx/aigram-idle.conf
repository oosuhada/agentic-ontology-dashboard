server {
    listen 8080;
    server_name aigram-api.oosu.dev;

    client_max_body_size 50m;

    location = /__aigram_activity {
        internal;
        proxy_pass http://127.0.0.1:8233/activity;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 500ms;
        proxy_read_timeout 2s;
    }

    location @aigram_api_starting {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3" always;
        return 503 '{"status":"starting","retry_after_seconds":3}';
    }

    location / {
        auth_request /__aigram_activity;
        proxy_intercept_errors on;
        error_page 502 503 504 = @aigram_api_starting;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 8080;
    server_name aigram.oosu.dev;

    client_max_body_size 50m;

    location = /__aigram_activity {
        internal;
        proxy_pass http://127.0.0.1:8233/activity;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 500ms;
        proxy_read_timeout 2s;
    }

    location @aigram_starting {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="3"><title>Aigram starting</title><style>html{color-scheme:dark}body{margin:0;background:#0b0b0e;color:#f4f4f5;font:15px/1.6 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{width:min(620px,calc(100vw - 48px));border:1px solid #2d2d34;border-radius:16px;padding:28px;background:#141419}h1{font-size:23px;margin:6px 0 10px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a2a2ad}</style></head><body><main class="card"><div class="eyebrow">Aigram</div><h1>Demo is starting</h1><div>The home-server demo sleeps after one hour without traffic. This page reconnects automatically.</div></main></body></html>';
    }

    location = /stories/stories_ChiangMai_001.mov {
        return 302 https://$host/stories/stories_ChiangMai_001.mp4$is_args$args;
    }

    location = /stories/stories_NYC_001.MOV {
        return 302 https://$host/stories/stories_NYC_001.mp4$is_args$args;
    }

    location = /stories/stories_NYC_002.mov {
        return 302 https://$host/stories/stories_NYC_002.mp4$is_args$args;
    }

    location = /stories/stories_NYC_005.MOV {
        return 302 https://$host/stories/stories_NYC_005.mp4$is_args$args;
    }

    location ~* ^/(stories|profile|posts|reels)/.*\.(?:jpg|jpeg|png|gif|webp|svg|ico)$ {
        root __HOME__/Services/instagram-orbstack/frontend/public;
        try_files $uri =404;
        max_ranges 0;
        etag off;
        if_modified_since off;
        expires off;
        add_header Cache-Control "no-store" always;
        add_header X-Aigram-Static "nginx" always;
    }

    location ~* ^/(stories|profile|posts|reels)/.*\.(?:mp4|mov|webm)$ {
        root __HOME__/Services/instagram-orbstack/frontend/public;
        try_files $uri =404;
        etag off;
        if_modified_since off;
        expires off;
        add_header Cache-Control "no-store" always;
        add_header X-Aigram-Static "nginx" always;
    }

    location / {
        auth_request /__aigram_activity;
        proxy_intercept_errors on;
        error_page 502 503 504 =200 @aigram_starting;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
