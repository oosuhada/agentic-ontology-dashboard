server {
    listen 8080;
    server_name text2cypher.oosu.dev;
    client_max_body_size 10m;

    location = /__factorygraph_activity {
        internal;
        proxy_pass http://127.0.0.1:8232/activity;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 500ms;
        proxy_read_timeout 2s;
    }

    location @factorygraph_starting {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="3"><title>FactoryGraph starting</title><style>html{color-scheme:dark}body{margin:0;background:#0a0d12;color:#e8edf5;font:15px/1.6 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{width:min(620px,calc(100vw - 48px));border:1px solid #293342;border-radius:14px;padding:28px;background:#111722}h1{font-size:23px;margin:6px 0 10px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8ea1ba}.bar{height:3px;background:#202a39;overflow:hidden;margin-top:22px}.bar:after{content:"";display:block;width:35%;height:100%;background:#b9c8dc;animation:m 1.2s infinite ease-in-out}@keyframes m{from{transform:translateX(-110%)}to{transform:translateX(320%)}}</style></head><body><main class="card"><div class="eyebrow">FactoryGraph · public demo</div><h1>Graph runtime is starting</h1><div>The demo sleeps after 45 minutes without traffic. This page reconnects automatically when Neo4j and the API are ready.</div><div class="bar"></div></main></body></html>';
    }

    location @factorygraph_starting_api {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3" always;
        return 503 '{"status":"starting","retry_after_seconds":3}';
    }

    location /api/ {
        auth_request /__factorygraph_activity;
        proxy_intercept_errors on;
        error_page 502 503 504 = @factorygraph_starting_api;
        proxy_pass http://127.0.0.1:8800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        auth_request /__factorygraph_activity;
        proxy_intercept_errors on;
        error_page 502 503 504 =200 @factorygraph_starting;
        proxy_pass http://127.0.0.1:8300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

server {
    listen 8080;
    server_name text2cypher-console.oosu.dev;

    location = /__factorygraph_activity {
        internal;
        proxy_pass http://127.0.0.1:8232/activity;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 500ms;
        proxy_read_timeout 2s;
    }

    location @factorygraph_console_starting {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "3" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="3"><title>FactoryGraph console starting</title></head><body style="font-family:system-ui;background:#0b0f15;color:#eef3fb;display:grid;place-items:center;min-height:100vh"><main><h2>FactoryGraph console is starting</h2><p>Reconnecting automatically…</p></main></body></html>';
    }

    location / {
        auth_request /__factorygraph_activity;
        proxy_intercept_errors on;
        error_page 502 503 504 =200 @factorygraph_console_starting;
        proxy_pass http://127.0.0.1:8851;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
