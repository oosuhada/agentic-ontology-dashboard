[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-dashboard-api"
version = "0.1.0"
description = "FastAPI service for ontology-aware dashboards, governed actions, and domain packs"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.28",
  "google-genai>=1.0",
  "jsonschema>=4.23",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "reportlab>=4.2",
  "uvicorn>=0.30"
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
postgres = ["psycopg[binary]>=3.2", "psycopg_pool>=3.2"]
production = ["psycopg[binary]>=3.2", "psycopg_pool>=3.2", "redis>=5.0"]

[tool.setuptools]
packages = ["ontology_dashboard", "factory_signal_board"]

[tool.pytest.ini_options]
testpaths = ["../tests", "tests"]
