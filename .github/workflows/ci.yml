name: predictive-maintenance-mvp-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'ml[dev]' -e 'api[dev,production]'
      - name: Install frontend and Chromium
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run current MVP release gate
        env:
          PYTHONPATH: ${{ github.workspace }}/api:${{ github.workspace }}/ml/src
        run: python scripts/release_gate.py --with-e2e --output current-mvp-release-gate.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-mvp-release-gate-${{ github.run_id }}
          path: current-mvp-release-gate.json
          if-no-files-found: error
          retention-days: 30
