name: ontology-dashboard-macmini

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+ stores major-version-specific data beneath
      # /var/lib/postgresql. Mount the parent so future pg_upgrade can operate
      # without crossing a mount boundary.
      - ${ONTOLOGY_DATA_ROOT}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [private]

  backend:
    build:
      context: ../..
      dockerfile: systems/backend/Dockerfile
      args:
        API_EXTRAS: macmini
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 2g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8000
      # Restored production data is authoritative on the Mac mini.  Seed/demo
      # bootstrap must be an explicit opt-in rather than silently mutating it.
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-0}
      # The public Mac mini demo intentionally exposes only the scoped,
      # read-only comparison viewer session used by the published Blueprint
      # showcase routes. General production deployments remain opt-in in the
      # application service itself.
      ENABLE_PUBLIC_BLUEPRINT_COMPARISON: ${ENABLE_PUBLIC_BLUEPRINT_COMPARISON:-1}
      ONTOLOGY_DASHBOARD_SEED_REFERENCE_DATA: ${ONTOLOGY_DASHBOARD_SEED_REFERENCE_DATA:-false}
      ONTOLOGY_DASHBOARD_DATABASE_URL: ${ONTOLOGY_DASHBOARD_DATABASE_URL}
      ONTOLOGY_DASHBOARD_DB_POOL_MIN: ${ONTOLOGY_DASHBOARD_DB_POOL_MIN:-1}
      ONTOLOGY_DASHBOARD_DB_POOL_MAX: ${ONTOLOGY_DASHBOARD_DB_POOL_MAX:-2}
      ONTOLOGY_DASHBOARD_DB_POOL_TIMEOUT: ${ONTOLOGY_DASHBOARD_DB_POOL_TIMEOUT:-10}
      ONTOLOGY_DASHBOARD_REDIS_URL: redis://redis:6379/0
      ONTOLOGY_DASHBOARD_ALLOWED_ORIGINS: ${ONTOLOGY_DASHBOARD_ALLOWED_ORIGINS:-}
      ONTOLOGY_DASHBOARD_ALLOWED_ORIGIN_REGEX: ${ONTOLOGY_DASHBOARD_ALLOWED_ORIGIN_REGEX}
      ONTOLOGY_DASHBOARD_ALLOW_HEURISTIC_MODEL_FALLBACK: ${ONTOLOGY_DASHBOARD_ALLOW_HEURISTIC_MODEL_FALLBACK:-0}
      MODEL_ARTIFACT_URI: ${BACKEND_MODEL_ARTIFACT_URI:-/artifacts/compressor-failure-risk/current}
      CNC_MODEL_ARTIFACT_URI: ${BACKEND_CNC_MODEL_ARTIFACT_URI:-/artifacts/cnc-failure-risk/current}
      LLM_PROVIDER: ${LLM_PROVIDER:-deterministic}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      MAINTENANCE_CONTEXT_PROVIDER: ${MAINTENANCE_CONTEXT_PROVIDER:-fixture}
      PREDICTION_RESULT_INGEST_TOKEN: ${PREDICTION_RESULT_INGEST_TOKEN:?PREDICTION_RESULT_INGEST_TOKEN is required}
    volumes:
      - ${ONTOLOGY_DATA_ROOT}/artifacts:/artifacts:ro
    ports:
      - 127.0.0.1:${BACKEND_PORT:-8110}:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks:
      private:
        aliases: [api]

  frontend:
    build:
      context: ../..
      dockerfile: systems/frontend/Dockerfile
      args:
        # Mac mini production is same-origin: nginx proxies /api/* to Backend.
        VITE_API_BASE_URL: ""
        VITE_FEATURE_ONTOLOGY_WORKBENCH: "true"
        VITE_FEATURE_DATASET_CATALOG: "false"
        VITE_FEATURE_GOVERNANCE_WORKBENCH: "false"
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-8120}:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [private]

  live-ingestor:
    build:
      context: ../..
      dockerfile: systems/backend/Dockerfile
      args:
        API_EXTRAS: macmini
    restart: unless-stopped
    cpus: 0.75
    mem_limit: 768m
    depends_on:
      postgres:
        condition: service_healthy
      generator-runtime:
        condition: service_healthy
    environment:
      APP_ENV: production
      ONTOLOGY_DASHBOARD_DATABASE_URL: ${ONTOLOGY_DASHBOARD_DATABASE_URL}
      MODEL_ARTIFACT_URI: ${BACKEND_MODEL_ARTIFACT_URI:-/artifacts/compressor-failure-risk/current}
      CNC_MODEL_ARTIFACT_URI: ${BACKEND_CNC_MODEL_ARTIFACT_URI:-/artifacts/cnc-failure-risk/current}
      ONTOLOGY_DASHBOARD_ALLOW_HEURISTIC_MODEL_FALLBACK: "0"
      GEN_DATA_RUNTIME_OUTPUT_ROOT: /gen-data-runtime
      ONTOLOGY_DASHBOARD_RUNTIME_PIPELINE_INPUT_ROOT: /runtime-pipeline-input
      ONTOLOGY_DASHBOARD_GENERATOR_RUNTIME_ENQUEUE_URL: ${ONTOLOGY_DASHBOARD_GENERATOR_RUNTIME_ENQUEUE_URL:-http://generator-runtime:8000/internal/runtime-pipeline/enqueue}
      LIVE_PM_POLL_SECONDS: ${LIVE_PM_POLL_SECONDS:-5}
      LOG_LEVEL: ${LIVE_PM_LOG_LEVEL:-INFO}
    command: ["python", "-m", "app.live_predictive_maintenance"]
    volumes:
      - ${ONTOLOGY_DATA_ROOT}/artifacts:/artifacts:ro
      - ${GEN_DATA_RUNTIME_OUTPUT_ROOT}:/gen-data-runtime:ro
      - ${RUNTIME_PIPELINE_INPUT_ROOT}:/runtime-pipeline-input
    networks: [private]

  generator-runtime:
    build:
      context: ../..
      dockerfile: systems/generator/Dockerfile
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 2g
    depends_on:
      backend:
        condition: service_healthy
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["systems.generator.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: production
      GENERATOR_RUNTIME_PREDICTION_ENABLED: "true"
      GENERATOR_EXTRACTION_ENABLED: "false"
      GENERATOR_RUNTIME_VERSION: ${GENERATOR_RUNTIME_VERSION:-hanbit-generator-runtime-v1}
      GENERATOR_PIPELINE_INPUT_ROOTS: /runtime-pipeline-input
      GENERATOR_PREDICTION_RESULT_URL: http://backend:8000/internal/prediction-results
      GENERATOR_PREDICTION_RESULT_PROJECT_ID: manufacturing-demo-project
      GENERATOR_PREDICTION_RESULT_WORKSPACE_ID: manufacturing-demo
      GENERATOR_PREDICTION_RESULT_TOKEN: ${PREDICTION_RESULT_INGEST_TOKEN:?PREDICTION_RESULT_INGEST_TOKEN is required}
      DATA_DIR: /data/source
      DATA_PREPROCESSED_DIR: /data/preprocessed
      ONTOLOGY_DIR: /data/ontology
      MODELS_STORE_DIR: /data/models
      MODEL_ARTIFACT_URI: /data/models/artifacts
      LOG_LEVEL: ${GENERATOR_LOG_LEVEL:-INFO}
    volumes:
      - ${ONTOLOGY_DATA_ROOT}/generator/source:/data/source
      - ${ONTOLOGY_DATA_ROOT}/generator/data_preprocessed:/data/preprocessed
      - ${ONTOLOGY_DATA_ROOT}/generator/ontology:/data/ontology
      - ${ONTOLOGY_DATA_ROOT}/artifacts:/data/models/artifacts:ro
      - ./generator-active-model-set.json:/data/models/active-model-set.json:ro
      - ${RUNTIME_PIPELINE_INPUT_ROOT}:/runtime-pipeline-input:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    networks: [private]

  generator:
    build:
      context: ../..
      dockerfile: systems/generator/Dockerfile
    restart: "no"
    cpus: 2.0
    mem_limit: 4g
    profiles: ["generator"]
    environment:
      APP_ENV: production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GENERATOR_LLM_PROVIDER: ${GENERATOR_LLM_PROVIDER:-openai}
      GENERATOR_LLM_MODEL: ${GENERATOR_LLM_MODEL:-gpt-4o-mini}
      VERTEX_AI_API_KEY: ${VERTEX_AI_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-application-credentials.json
      DATA_DIR: /data/source
      DATA_PREPROCESSED_DIR: /data/preprocessed
      ONTOLOGY_DIR: /data/ontology
      MODELS_STORE_DIR: /data/models
      MODEL_ARTIFACT_URI: /artifacts
      GENERATOR_TRAINING_N_JOBS: ${GENERATOR_TRAINING_N_JOBS:-2}
      LOG_LEVEL: ${GENERATOR_LOG_LEVEL:-INFO}
    volumes:
      - ${ONTOLOGY_DATA_ROOT}/generator/source:/data/source:ro
      - ${ONTOLOGY_DATA_ROOT}/generator/data_preprocessed:/data/preprocessed
      - ${ONTOLOGY_DATA_ROOT}/generator/ontology:/data/ontology
      - ${ONTOLOGY_DATA_ROOT}/generator/models_store:/data/models
      - ${ONTOLOGY_DATA_ROOT}/generator/logs:/logs
      - ${ONTOLOGY_DATA_ROOT}/artifacts:/artifacts
      - ${RUNTIME_PIPELINE_INPUT_ROOT}:/runtime-pipeline-input:ro
      - ${GENERATOR_GOOGLE_APPLICATION_CREDENTIALS_HOST:-/dev/null}:/run/secrets/google-application-credentials.json:ro
    networks: [private]

networks:
  private:
    driver: bridge
