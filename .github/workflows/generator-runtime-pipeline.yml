name: generator-runtime-pipeline

on:
  pull_request:
    paths:
      - "contracts/schemas/generator-pipeline-run-state.schema.json"
      - "contracts/schemas/generator-runtime-feature.schema.json"
      - "contracts/schemas/generator-model-prediction-result.schema.json"
      - "contracts/schemas/prediction-result-batch.schema.json"
      - "contracts/schemas/generator-runtime-prediction-stage.schema.json"
      - "contracts/test-vectors/generator-runtime-prediction-v1/**"
      - "systems/generator/**"
      - "tests/test_runtime_input_context.py"
      - "tests/test_generator_runtime_pipeline.py"
      - "tests/test_runtime_overlay_generator_enqueue.py"
      - ".github/workflows/generator-runtime-pipeline.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/schemas/generator-pipeline-run-state.schema.json"
      - "contracts/schemas/generator-runtime-feature.schema.json"
      - "contracts/schemas/generator-model-prediction-result.schema.json"
      - "contracts/schemas/prediction-result-batch.schema.json"
      - "contracts/schemas/generator-runtime-prediction-stage.schema.json"
      - "contracts/test-vectors/generator-runtime-prediction-v1/**"
      - "systems/generator/**"
      - "tests/test_runtime_input_context.py"
      - "tests/test_generator_runtime_pipeline.py"
      - "tests/test_runtime_overlay_generator_enqueue.py"
      - ".github/workflows/generator-runtime-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: generator-runtime-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generator-runtime-pipeline:
    name: generator-runtime-pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Generator and Backend dependencies
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -r systems/generator/requirements.txt
          python -m pip install --no-cache-dir -e "./systems/backend[dev]"

      - name: Run Runtime Pipeline tests
        env:
          APP_ENV: test
          PYTHONPATH: .
        run: python -m pytest -v tests/test_runtime_input_context.py tests/test_generator_runtime_pipeline.py tests/test_runtime_overlay_generator_enqueue.py
